<section class="seo-content">
  <h1>שאלות נפוצות על קייטרינג לשבת ואזכרות</h1>

  <h2>כמה זמן מראש צריך להזמין?</h2>
  <p>מומלץ להזמין לפחות 48 שעות מראש.</p>

  <h2>האם האוכל מגיע חם?</h2>
  <p>כן, האוכל מגיע חם ומוכן להגשה.</p>

  <h2>האם ניתן לבצע שינויים?</h2>
  <p>כן, ניתן לבצע שינויים עד 48 שעות לפני האירוע.</p>

  <h2>האם יש מינימום הזמנה?</h2>
  <p>כן, מינימום 30 מנות.</p>
</section>
